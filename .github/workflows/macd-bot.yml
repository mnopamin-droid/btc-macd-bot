name: BTC MACD 4H

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests numpy pandas
      - run: python btc_macd_bot.py
        env:
          IPPANEL_API_KEY: ${{ secrets.IPPANEL_API_KEY }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
